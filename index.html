<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>The Almanac</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ffd166'/%3E%3C/svg%3E" />
<style>
  :root {
    --ink: #12141f;
    --void: #080a12;
    --paper: #f2ecdd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--void); }
  body {
    font-family: 'Nunito', ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  #view {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }
  #overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  .hud {
    position: absolute;
    top: 14px;
    left: 14px;
    padding: 12px 14px;
    min-width: 246px;
    border-radius: 14px;
    background: rgba(10, 13, 24, 0.74);
    border: 1px solid rgba(255, 255, 255, 0.09);
    font: 12px/1.65 ui-monospace, 'Space Mono', SFMono-Regular, Menlo, monospace;
    backdrop-filter: blur(8px);
  }
  .hud .row { white-space: nowrap; }
  .hud .dim { color: rgba(242, 236, 221, 0.42); }
  .hud .good { color: #7fe0a8; }
  .hud .bad { color: #ff8f6b; }
  .hud .trail { color: rgba(242, 236, 221, 0.5); margin-bottom: 4px; }
  .hud .trail .on { color: #ffd166; font-weight: 700; }
  .hud .trail .sep { opacity: 0.3; margin: 0 2px; }
  .scalebar {
    position: absolute;
    right: 18px;
    bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    font: 11px ui-monospace, 'Space Mono', monospace;
    color: rgba(242, 236, 221, 0.8);
  }
  .scalebar .bar {
    display: block;
    height: 6px;
    border: 1.5px solid rgba(242, 236, 221, 0.8);
    border-top: none;
  }
  .hint {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    padding: 7px 15px;
    border-radius: 999px;
    background: rgba(10, 13, 24, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.09);
    font-size: 12.5px;
    letter-spacing: 0.01em;
    color: rgba(242, 236, 221, 0.7);
  }
</style>
<canvas id="view"></canvas>
<div id="overlay">
  <div class="hint">scroll to zoom &middot; drag to pan &middot; click to dive &middot; Home to reset</div>
</div>
<script type="module" src="/src/main.ts"></script>
