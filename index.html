<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>The Almanac</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ffd166'/%3E%3C/svg%3E" />
<style>
  :root {
    --ink: #12141f;
    --void: #080a12;
    --paper: #f2ecdd;
    --panel: rgba(10, 13, 24, 0.72);
    --hair: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--void); }
  body {
    font-family: Nunito, ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  /* The overlay ignores the pointer so the canvas gets every drag; interactive bits opt back in. */
  #overlay { position: fixed; inset: 0; pointer-events: none; }

  .hud {
    position: absolute;
    top: 14px;
    left: 14px;
    padding: 11px 14px 12px;
    min-width: 258px;
    border-radius: 15px;
    background: var(--panel);
    border: 1px solid var(--hair);
    backdrop-filter: blur(9px);
  }
  .hud .name { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
  .hud .sub { font-size: 11.5px; opacity: 0.55; margin-bottom: 7px; max-width: 34ch; line-height: 1.4; }
  .stamp {
    position: absolute;
    left: 18px;
    bottom: 16px;
    font: 10px ui-monospace, "Space Mono", SFMono-Regular, Menlo, monospace;
    color: rgba(242, 236, 221, 0.26);
    letter-spacing: 0.03em;
    user-select: text;
  }
  .hud .rows { font: 11.5px/1.7 ui-monospace, "Space Mono", SFMono-Regular, Menlo, monospace; }
  .hud .rows > div { white-space: nowrap; }
  .dim { color: rgba(242, 236, 221, 0.4); }
  .good { color: #7fe0a8; }
  .bad { color: #ff8f6b; }

  .trail {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 5px 9px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--hair);
    backdrop-filter: blur(9px);
    pointer-events: auto;
    max-width: min(92vw, 760px);
    overflow: hidden;
  }
  .trail .crumb {
    appearance: none;
    border: 0;
    background: transparent;
    color: rgba(242, 236, 221, 0.55);
    font: 600 12px Nunito, ui-sans-serif, system-ui, sans-serif;
    padding: 3px 8px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .trail .crumb:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); color: var(--paper); }
  .trail .crumb.on { color: #ffd166; cursor: default; }
  .trail .crumb:disabled { cursor: default; }
  .trail .sep { opacity: 0.25; font-size: 11px; }

  .scalebar {
    position: absolute;
    right: 18px;
    bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    font: 11px ui-monospace, "Space Mono", monospace;
    color: rgba(242, 236, 221, 0.8);
  }
  .scalebar .bar {
    display: block;
    height: 6px;
    border: 1.5px solid rgba(242, 236, 221, 0.8);
    border-top: none;
  }
  @media (max-width: 720px) {
    .hud { min-width: 0; font-size: 11px; }
    .hud .rows { display: none; }
  </style>
<canvas id="view"></canvas>
<div id="overlay"></div>
<script type="module" src="/src/main.ts"></script>
