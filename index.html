<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>The Almanac</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ffd166'/%3E%3C/svg%3E" />
<style>
  :root {
    --ink: #12141f;
    --void: #080a12;
    --paper: #f2ecdd;
    --panel: rgba(10, 13, 24, 0.72);
    --hair: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--void); }
  body {
    font-family: Nunito, ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  /* The overlay ignores the pointer so the canvas gets every drag; interactive bits opt back in. */
  #overlay { position: fixed; inset: 0; pointer-events: none; }

  /**
   * The default view has NO WORDS ON IT. What is left is a ladder of eight rungs and a rail of kept places, and
   * both are pictures. The numbers live behind the backtick key.
   */
  .hud {
    position: absolute;
    top: 46px;
    left: 50%;
    transform: translateX(-50%);
    padding: 9px 13px;
    border-radius: 13px;
    background: var(--panel);
    border: 1px solid var(--hair);
    backdrop-filter: blur(9px);
    display: none;
  }
  .hud.measuring { display: block; }
  .hud .rows { font: 11.5px/1.7 ui-monospace, "Space Mono", SFMono-Regular, Menlo, monospace; }
  .hud .rows > div { white-space: nowrap; }
  .dim { color: rgba(242, 236, 221, 0.4); }
  .good { color: #7fe0a8; }
  .bad { color: #ff8f6b; }

  /* Eight rungs of the ladder. The one you are on is filled; the ones above it take you back out. */
  .rungs {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 11px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--hair);
    backdrop-filter: blur(9px);
    pointer-events: auto;
  }
  .rungs .pip {
    appearance: none;
    width: 9px;
    height: 9px;
    padding: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(242, 236, 221, 0.3);
    background: transparent;
    cursor: pointer;
    transition: background 120ms, border-color 120ms, transform 120ms;
  }
  .rungs .pip:disabled { cursor: default; border-color: rgba(242, 236, 221, 0.16); }
  .rungs .pip.past { border-color: rgba(242, 236, 221, 0.62); }
  .rungs .pip.past:hover { background: rgba(242, 236, 221, 0.62); transform: scale(1.25); }
  .rungs .pip.on {
    background: #ffd166;
    border-color: #ffd166;
    transform: scale(1.35);
  }

  /* Places you kept. A column of thumbnails, and one empty tile that keeps the view you are looking at. */
  .rail {
    position: absolute;
    right: 14px;
    top: 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    pointer-events: auto;
    max-height: calc(100vh - 28px);
    overflow-y: auto;
    scrollbar-width: none;
  }
  .rail::-webkit-scrollbar { display: none; }
  .mark {
    position: relative;
    appearance: none;
    width: 58px;
    height: 40px;
    padding: 0;
    border-radius: 8px;
    border: 1px solid var(--hair);
    background: var(--panel) center / cover no-repeat;
    cursor: pointer;
    transition: transform 120ms, border-color 120ms;
  }
  .mark:hover { transform: scale(1.06); border-color: rgba(255, 209, 102, 0.85); }
  .mark .drop {
    position: absolute;
    top: -5px;
    right: -5px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: rgba(10, 13, 24, 0.92);
    border: 1px solid var(--hair);
    opacity: 0;
    transition: opacity 120ms;
  }
  .mark:hover .drop { opacity: 1; }
  /* A cross, drawn rather than typed: two strokes, no glyph, no language. */
  .mark .drop::before,
  .mark .drop::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 6.5px;
    width: 7px;
    height: 1.5px;
    background: rgba(242, 236, 221, 0.75);
  }
  .mark .drop::before { transform: rotate(45deg); }
  .mark .drop::after { transform: rotate(-45deg); }
  /* And a plus on the empty tile, the same way. */
  .mark.keep { border-style: dashed; border-color: rgba(242, 236, 221, 0.28); }
  .mark.keep::before,
  .mark.keep::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    background: rgba(242, 236, 221, 0.45);
    transform: translate(-50%, -50%);
  }
  .mark.keep::before { width: 15px; height: 1.6px; }
  .mark.keep::after { width: 1.6px; height: 15px; }
  .mark.keep:hover::before,
  .mark.keep:hover::after { background: #ffd166; }

  @media (max-width: 720px) {
    .mark { width: 46px; height: 32px; }
  }
</style>
<canvas id="view"></canvas>
<div id="overlay"></div>
<script type="module" src="/src/main.ts"></script>
